[project]
name = "paper-env"
version = "0.1.0"
description = "CrisisGrid Paper Environment: notebook + isolated Python env runner + dataset storage"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
