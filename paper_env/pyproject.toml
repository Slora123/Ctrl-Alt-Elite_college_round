[project]
name = "paper-env"
version = "0.1.0"
description = "CrisisGrid Paper Environment: notebook + isolated Python env runner + dataset storage"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "packaging>=26.3",
    "httpx>=0.28.1",
    "jupyter-client>=8.10.0",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 180
