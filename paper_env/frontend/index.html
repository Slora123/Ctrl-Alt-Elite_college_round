<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f9ab00'/%3E%3C/svg%3E">
  <title>Paper Environment</title>
</head>
<body>
  <header>
    <h1>Paper <span>Environment</span></h1>
    <select id="envSel" title="Paper environment"></select>
    <button id="newEnvBtn">+ New paper env</button>
    <span class="meta" id="health"></span>
  </header>
  <div class="layout">
    <main>
      <div id="newEnv" class="card" style="display:none;margin-bottom:12px">
        <div class="row"><input id="neAlias" placeholder="alias e.g. resnet-2015"><input id="neHash" placeholder="paper hash" value="demo">
          <input id="neSeed" type="number" value="42" style="max-width:80px" title="seed">
          <label><input type="checkbox" id="neBuild" checked style="flex:0"> build env (uv)</label>
          <button class="primary" id="neGo">Create</button></div>
      </div>
      <div id="notebook"></div>
    </main>
    <aside><div class="tabs" id="tabs"></div><div class="card" id="panel"></div></aside>
  </div>
  <div id="toast"></div>
  <script>window.__webpack_public_path__ = location.pathname;</script> <!-- some JupyterLab packages expect this webpack global -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
