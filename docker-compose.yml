# Local parity stack: Postgres 16 + pgvector, Redis, MinIO, API.   docker compose up --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crisisgrid
      POSTGRES_PASSWORD: crisisgrid
      POSTGRES_DB: crisisgrid
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisisgrid"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crisisgrid
      MINIO_ROOT_PASSWORD: crisisgrid-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      CG_ENV: dev
      CG_DATABASE_URL: postgresql+psycopg://crisisgrid:crisisgrid@postgres:5432/crisisgrid
      CG_REDIS_URL: redis://redis:6379/0
      CG_S3_ENDPOINT: http://minio:9000
      CG_S3_BUCKET: crisisgrid
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    ports: ["8000:8000"]

volumes:
  pgdata:
  miniodata:
