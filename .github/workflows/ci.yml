name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, api]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (one uv workspace: core, api and paper_env share a lock file and a venv)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy ${{ matrix.package == 'core' && 'crisisgrid_core' || 'crisisgrid_api' }}
      - name: Test
        run: uv run pytest

  paper-env:
    # paper_env uses POSIX-only APIs (fcntl) and needs uv; it cannot run on Windows. It was NOT verified when this job was
    # added, so a failure here is informative, not blocking, until the baseline is known.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: paper_env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --frozen
      - name: Test
        run: uv run pytest
