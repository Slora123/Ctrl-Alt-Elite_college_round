[project]
name = "crisisgrid-core"
version = "0.1.0"
description = "CrisisGrid core: shared models, experiment graph service, claim verifier (pure code, no persistence)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crisisgrid_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["crisisgrid_core"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
