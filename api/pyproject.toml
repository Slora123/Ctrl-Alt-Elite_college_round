[project]
name = "crisisgrid-api"
version = "0.1.0"
description = "CrisisGrid API gateway and shared plumbing (config, logging, DB, event log)"
requires-python = ">=3.11"
dependencies = [
    "crisisgrid-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crisisgrid_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["crisisgrid_api", "crisisgrid_core"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
